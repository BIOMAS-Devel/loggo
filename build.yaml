targets:
  $default:
    builders:
      loggo|logger:
        generate_for:
          - lib/**/*.dart

builders:
  logger:
    import: "package:loggo/src/logger_builder_factory.dart"
    builder_factories: ["loggerBuilderFactory"]
    build_extensions: {".dart": [".loggo.dart"]}
    auto_apply: dependents
    build_to: source
    applies_builders: ["source_gen|combining_builder"]
